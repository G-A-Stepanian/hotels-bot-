name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hotels   # все run-команды выполняются в папке hotels/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pip-audit

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy handlers/ api/ repositories/ --ignore-missing-imports

      - name: Pytest
        run: pytest tests/ -v
        env:
          RAPIDAPI_KEY: "dummy"
          RAPIDAPI_HOST: "dummy"
          BOT_TOKEN: "dummy"

      - name: pip-audit (security)
        run: pip-audit
